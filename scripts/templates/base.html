<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ACL2 KG Browser{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <style>
    .cell-card { border-left: 4px solid #dee2e6; margin-bottom: 0.5rem; }
    .cell-card.code { border-left-color: #0d6efd; }
    .cell-card.markdown { border-left-color: #198754; }
    .cell-card.highlight { background-color: #fff3cd !important; }
    .cell-card.portcullis { border-left-color: #dc3545; }
    pre code { font-size: 0.85rem; }
    .badge { font-weight: 500; }
    .symbol-link { text-decoration: none; }
    .symbol-link:hover { text-decoration: underline; }
    .kind-badge { font-size: 0.75rem; }
    .stats-card { min-width: 180px; }
    .search-form select { max-width: 140px; }
    .cell-header { font-size: 0.8rem; color: #6c757d; }
    .distance { font-size: 0.75rem; color: #999; }
    .dep-grid { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .nb-path { font-family: monospace; font-size: 0.9rem; }
    .summary-box { background: #f8f9fa; border-left: 3px solid #0d6efd; padding: 0.5rem 0.75rem; margin-top: 0.25rem; font-size: 0.85rem; }
    .summary-box .what-label { color: #0d6efd; font-weight: 600; }
    .summary-box .why-label { color: #198754; font-weight: 600; }
    .summary-box .how-label { color: #0dcaf0; font-weight: 600; }
    pre { margin-bottom: 0; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">ACL2 KG</a>
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="/notebooks">Notebooks</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/summaries">Summaries</a>
        </li>
      </ul>
      <form class="d-flex search-form" action="/search" method="get">
        <input class="form-control me-2" type="search" name="q"
               placeholder="Search…" value="{{ request.args.get('q', '') }}"
               aria-label="Search">
        <select class="form-select me-2" name="target">
          <option value="symbol"  {%- if request.args.get('target','symbol')=='symbol' %} selected{% endif %}>Symbols</option>
          <option value="code"    {%- if request.args.get('target')=='code' %} selected{% endif %}>Code</option>
          <option value="comment" {%- if request.args.get('target')=='comment' %} selected{% endif %}>Comments</option>
          <option value="summary" {%- if request.args.get('target')=='summary' %} selected{% endif %}>Summaries</option>
        </select>
        <select class="form-select me-2" name="mode">
          <option value="semantic" {%- if request.args.get('mode','semantic')=='semantic' %} selected{% endif %}>Semantic</option>
          <option value="keyword"  {%- if request.args.get('mode')=='keyword' %} selected{% endif %}>Keyword</option>
        </select>
        {% if available_versions %}
        <select class="form-select me-2" name="version" id="version-select" style="max-width:170px">
          <option value="">All versions</option>
          {% for v in available_versions %}
          <option value="{{ v }}" {%- if selected_version == v %} selected{% endif %}>{{ v }}</option>
          {% endfor %}
        </select>
        {% endif %}
        <button class="btn btn-outline-light" type="submit">Go</button>
      </form>
    </div>
  </nav>

  <main class="container-fluid px-4 mt-3">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/lisp.min.js"></script>
  <script>hljs.highlightAll();</script>
  <script>
  // ── Sticky version selection ──────────────────────────────────────
  (function() {
    const STORAGE_KEY = 'acl2kg_version';
    const sel = document.getElementById('version-select');

    // On page load: if URL has ?version=, store it. Otherwise restore
    // saved version (into the dropdown AND inject into the URL).
    const params = new URLSearchParams(window.location.search);
    const urlVersion = params.get('version');

    if (urlVersion !== null) {
      // URL has an explicit version param — save it (even if empty = "All")
      localStorage.setItem(STORAGE_KEY, urlVersion);
    } else {
      // No version in URL — restore from storage if we have one
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && sel) {
        sel.value = saved;
        // Also update the current URL so server-side filtering works
        // on page loads from navigation links.
        params.set('version', saved);
        const newUrl = window.location.pathname + '?' + params.toString();
        window.history.replaceState(null, '', newUrl);
        // Reload so the server uses the version filter
        window.location.replace(newUrl);
        return; // don't run the rest while reloading
      }
    }

    // When the user changes the dropdown, save + reload with the new version
    if (sel) {
      sel.addEventListener('change', function() {
        localStorage.setItem(STORAGE_KEY, this.value);
        params.set('version', this.value);
        window.location.search = params.toString();
      });
    }

    // Inject version param into all internal links on the page
    const version = localStorage.getItem(STORAGE_KEY);
    if (version) {
      document.querySelectorAll('a[href]').forEach(function(a) {
        const href = a.getAttribute('href');
        // Only modify internal links (same origin, not #anchors, not external)
        if (!href || href.startsWith('#') || href.startsWith('http')
            || href.startsWith('javascript:')) return;
        try {
          const url = new URL(href, window.location.origin);
          if (url.origin !== window.location.origin) return;
          if (!url.searchParams.has('version')) {
            url.searchParams.set('version', version);
            a.setAttribute('href', url.pathname + url.search + url.hash);
          }
        } catch(e) {}
      });
    }
  })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
